<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Mosaelia — сцены</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f3e6d4;
            font-family: Georgia, serif;
            color: #3a2a22;
        }
        h1 { font-size: 22px; margin: 0 0 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        .card {
            background: #fffaf3;
            padding: 12px;
            border-radius: 14px;
            box-shadow: 0 8px 16px rgba(90, 50, 20, 0.12);
        }
        .frame {
            background: linear-gradient(145deg, #f0d39a, #a07840);
            padding: 8px;
            border-radius: 10px;
        }
        .art {
            width: 100%;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border-radius: 6px;
        }
        h3 { font-size: 14px; margin: 10px 0 0; text-align: center; font-weight: 600; }
        .meta { font-size: 11px; color: #7a5a3a; font-family: system-ui, sans-serif; }
    </style>
</head>
<body>
    <h1>Картины Мозаэлии</h1>
    <div class="grid" id="grid"></div>
    <script type="module">
        import { COLORS, LEVELS, tilesFor } from "../../js/levels.js?v=7";
        import { artBackground } from "../../js/art.js?v=7";
        const root = document.getElementById("grid");
        for (const level of LEVELS) {
            const missing = [...new Set(level.pieces.map((p) => p.color))].filter((id) => !COLORS[id]);
            if (missing.length) throw new Error(`${level.id}: ${missing}`);
            const card = document.createElement("div");
            card.className = "card";
            const frame = document.createElement("div");
            frame.className = "frame";
            const art = document.createElement("div");
            art.className = "art";
            art.style.aspectRatio = `${level.cols} / ${level.rows}`;
            art.style.backgroundImage = artBackground(level);
            frame.appendChild(art);
            const h = document.createElement("h3");
            const types = new Set(level.pieces.map((p) => p.color)).size;
            h.innerHTML = `${level.title}<div class="meta">${level.cols}×${level.rows} · ${level.pieces.length} камней · ${tilesFor(level).length} плиток · ${types} цветов</div>`;
            card.append(frame, h);
            root.appendChild(card);
        }
    </script>
</body>
</html>
