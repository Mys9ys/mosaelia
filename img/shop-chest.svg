    <radialGradient id="coin" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 68) scale(5.5)">
      <stop stop-color="#fff8d0"/>
      <stop offset="0.6" stop-color="#ffd878"/>
