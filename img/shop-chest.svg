<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <ellipse cx="48" cy="85" rx="34" ry="6.5" fill="#2a1810" opacity="0.16"/>
  <!-- body -->
  <path d="M16 52c0-2 28-4 32-4s32 2 32 4v22c0 2-28 4-32 4s-32-2-32-4V52z" fill="url(#woodBody)"/>
  <path d="M16 58h64v16c0 2-28 4-32 4s-32-2-32-4V58z" fill="url(#woodDeep)"/>
  <!-- lid -->
  <path d="M20 52c0-18 12-28 28-28s28 10 28 28" fill="url(#woodLid)"/>
  <path d="M20 52c0-18 12-28 28-28s28 10 28 28" stroke="#fff8ee" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <!-- bands -->
  <path d="M18 54h60" stroke="url(#goldBand)" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 66h52" stroke="url(#goldBand)" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <!-- lock -->
  <rect x="36" y="54" width="24" height="20" rx="7" fill="url(#lockGold)"/>
  <rect x="42" y="60" width="12" height="10" rx="4" fill="#8d5a28"/>
  <circle cx="48" cy="65" r="2.2" fill="#fffaf3"/>
  <!-- clasp -->
  <path d="M44 48v8" stroke="#a07040" stroke-width="4" stroke-linecap="round"/>
  <!-- coins -->
  <ellipse cx="74" cy="72" rx="10" ry="4" fill="#5a3a18" opacity="0.12"/>
  <circle cx="70" cy="68" r="5.5" fill="url(#coin)"/>
  <circle cx="78" cy="70" r="4.5" fill="url(#coin)" opacity="0.85"/>
  <defs>
    <linearGradient id="woodBody" x1="16" y1="48" x2="80" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0d8a8"/>
      <stop offset="0.5" stop-color="#d4a058"/>
      <stop offset="1" stop-color="#9a6038"/>
    </linearGradient>
    <linearGradient id="woodDeep" x1="48" y1="58" x2="48" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c88848"/>
      <stop offset="1" stop-color="#704828"/>
    </linearGradient>
    <linearGradient id="woodLid" x1="48" y1="22" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8ee"/>
      <stop offset="0.4" stop-color="#ecc888"/>
      <stop offset="1" stop-color="#b87840"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="18" y1="0" x2="78" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4c0"/>
